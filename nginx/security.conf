# Included by default.conf (server context). Headers are safe here;
# location blocks must live in the server block, not in this include.

add_header X-Frame-Options SAMEORIGIN always;

add_header X-Content-Type-Options nosniff always;

add_header Referrer-Policy strict-origin-when-cross-origin always;

add_header Permissions-Policy "interest-cohort=()" always;

# Never serve dotfiles (wp-config backup copies, .htaccess, .env, .git...).
location ~ /\. {
    deny all;
}

# Deny access to composer/package manifest files.
location ~* /(composer\.(json|lock)|package\.json|package-lock\.json|yarn\.lock)$ {
    deny all;
}

# Deny access to readme / license / changelog files (info disclosure).
location ~* /(readme|license|changelog|CHANGELOG|README)[^/]*$ {
    deny all;
}
