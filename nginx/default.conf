server {

    listen 80;

    server_name _;

    root /var/www/html;

    index index.php index.html;

    access_log /var/log/nginx/access.log;

    error_log /var/log/nginx/error.log;

    include /etc/nginx/conf.d/security.conf;

    # Never serve dotfiles (wp-config backup copies, .htaccess, .env, .git...).
    location ~ /\. {
        deny all;
    }

    # Deny access to composer/package manifest files.
    location ~* /(composer\.(json|lock)|package\.json|package-lock\.json|yarn\.lock)$ {
        deny all;
    }

    # Deny access to readme / license / changelog files (info disclosure).
    location ~* /(readme|license|changelog|CHANGELOG|README)[^/]*$ {
        deny all;
    }

    # Only serve requests that reference an actual file/directory.
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # WordPress front controller for requests that want a PHP script.
    location ~ ^/(index\.php|wp-(admin|login)|xmlrpc\.php|wp-json)(/|$) {
        include /etc/nginx/fastcgi.conf;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
    }

    # Any other .php request (e.g. wp-content/foo.php) → 404. Stops backdoor shells.
    location ~ \.php$ {
        return 404;
    }

    # Deny execution of PHP inside /wp-content/uploads (attacker-controlled files).
    location ~ ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    # Static asset caching.
    location ~* \.(jpg|jpeg|png|gif|css|js|svg|woff|woff2|ttf|eot|ico|webp|avif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Do not log /favicon.ico and /robots.txt.
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }
}